# Same PVC, deliberately scheduled onto the OTHER worker. If the file is here, the
# data was never on the first pod's node - it is in the Longhorn volume, and
# Longhorn re-attached that volume somewhere else.
apiVersion: v1
kind: Pod
metadata:
  name: lh-reader
  namespace: lh-demo
spec:
  nodeSelector:
    kubernetes.io/hostname: k3s-server
  restartPolicy: Never
  containers:
    - name: reader
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "reading on $(hostname):"
          cat /data/proof.txt
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: lh-pvc
