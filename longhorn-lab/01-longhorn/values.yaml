# Longhorn 1.12.1 (chart version 1.12.1), sized for the lab's two VMs.
#
# Every non-default below is either a lab concession or a deliberate choice the
# lesson talks about. On a production cluster you would keep most of the defaults.
persistence:
  # Create the `longhorn` StorageClass and mark it the cluster default. It is
  # expandable (allowVolumeExpansion: true) out of the box.
  defaultClass: true
  # Two nodes, two copies. This number decides how much redundancy a volume has,
  # and Lesson 01 kills a node to show exactly what it buys.
  defaultClassReplicaCount: 2

csi:
  # The chart defaults to 3 replicas of each CSI sidecar. One is plenty for a lab.
  # Set them at install time: a later `helm upgrade` ignores these for deployments
  # that already exist.
  attacherReplicaCount: 1
  provisionerReplicaCount: 1
  resizerReplicaCount: 1
  snapshotterReplicaCount: 1

defaultSettings:
  # Only nodes labelled node.longhorn.io/create-default-disk=true become storage
  # nodes, instead of Longhorn claiming a default disk on every node it ever sees.
  createDefaultDiskLabeledNodes: true
  defaultDataPath: /var/lib/longhorn
  # Replicas per volume for volumes created without an explicit count. Keep it in
  # step with defaultClassReplicaCount above.
  defaultReplicaCount: '{"v1":"2","v2":"2"}'
  # Longhorn refuses to schedule onto a disk with less than this percentage free.
  # 10% is comfortable on a 20GB VM disk; the 25% default wastes space in a lab.
  storageMinimalAvailablePercentage: 10
  # Allow scheduling more nominal capacity than the disks physically hold, so the
  # lesson can show what thin provisioning does and does not promise.
  storageOverProvisioningPercentage: 200
  # Longhorn reserves a slice of each node's CPU for its instance managers. The 12%
  # default is a lot on a 2-vCPU VM; 5% is plenty here.
  guaranteedInstanceManagerCPU: '{"v1":"5","v2":"5"}'

longhornUI:
  # Chart default is 2 replicas of the UI. One is enough; nobody is on call.
  replicas: 1
