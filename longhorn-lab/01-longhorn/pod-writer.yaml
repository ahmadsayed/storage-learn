apiVersion: v1
kind: Pod
metadata:
  name: lh-writer
  namespace: lh-demo
spec:
  nodeSelector:
    kubernetes.io/hostname: k3s-agent
  restartPolicy: Never
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "written on $(hostname) at $(date -u +%FT%TZ)" > /data/proof.txt
          sync
          cat /data/proof.txt
          df -h /data
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: lh-pvc
