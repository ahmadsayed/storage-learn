apiVersion: v1
kind: Pod
metadata:
  name: lh-continuous-writer
  namespace: lh-demo
spec:
  # Pinned to the node we are NOT going to kill, so the log shows whether the
  # volume kept serving while its other replica's node was gone.
  nodeSelector:
    kubernetes.io/hostname: k3s-server
  restartPolicy: Never
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          i=1
          while [ $i -le 24 ]; do
            echo "write $i at $(date -u +%FT%TZ) from $(hostname)" >> /data/continuous.log
            sync
            i=$((i+1))
            sleep 10
          done
          echo "--- final contents ---"
          cat /data/continuous.log
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: lh-pvc
