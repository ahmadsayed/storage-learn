# Runs after the RBD claim has been expanded. Prints both the *filesystem* size
# the pod sees and the *PVC* size Kubernetes reports, because those two numbers
# are allowed to disagree for a while: the CSI controller grows the RBD image
# first, and the filesystem is only grown when the volume is staged on a node.
apiVersion: v1
kind: Pod
metadata:
  name: rbd-verify
  namespace: ceph-demo
spec:
  nodeSelector:
    kubernetes.io/hostname: csilab-worker
  restartPolicy: Never
  containers:
    - name: verify
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "--- inside the pod ---"
          df -h /data | tail -1
          echo "--- the file Lesson 02 wrote ---"
          cat /data/proof.txt
          echo "expanded and still readable $(date -u +%FT%TZ)" >> /data/proof.txt
          sync
          tail -2 /data/proof.txt
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: rbd-pvc
