apiVersion: v1
kind: Pod
metadata:
  name: rbd-restored-reader
  namespace: ceph-demo
spec:
  # Pinned to csilab-worker2: the node Lesson 02's failure drill does NOT kill,
  # so re-creating this pod after the kill proves the degraded volume still mounts.
  nodeSelector:
    kubernetes.io/hostname: csilab-worker2
  restartPolicy: Never
  containers:
    - name: reader
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "--- contents of the volume restored FROM A SNAPSHOT ---"
          cat /data/proof.txt
          df -h /data | tail -1
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: rbd-restored
