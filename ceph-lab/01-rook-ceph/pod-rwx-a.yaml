# The writer half of the RWX pair. Pinned to csilab-worker...
apiVersion: v1
kind: Pod
metadata:
  name: rwx-writer
  namespace: ceph-demo
  labels:
    app: rwx-demo
    role: writer
spec:
  nodeSelector:
    kubernetes.io/hostname: csilab-worker
  restartPolicy: Never
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "hello from $(hostname) at $(date -u +%FT%TZ)" > /shared/from-writer.txt
          sync
          echo "writer wrote:"; cat /shared/from-writer.txt
          sleep 3600
      volumeMounts:
        - name: shared
          mountPath: /shared
  volumes:
    - name: shared
      persistentVolumeClaim:
        claimName: cephfs-rwx
