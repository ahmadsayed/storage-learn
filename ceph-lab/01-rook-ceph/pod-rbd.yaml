# Writes a timestamp and the node name into the RBD volume. The pod will be
# deleted and recreated in Lesson 04 to prove the data is in Ceph, not here.
apiVersion: v1
kind: Pod
metadata:
  name: rbd-writer
  namespace: ceph-demo
spec:
  nodeSelector:
    kubernetes.io/hostname: csilab-worker
  restartPolicy: Never
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "written $(date -u +%FT%TZ) on $(hostname)" > /data/proof.txt
          sync
          cat /data/proof.txt
          df -h /data
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: rbd-pvc
