# Reads the volume that was created *from the snapshot*. If the snapshot really
# captured the data, proof.txt is here.
apiVersion: v1
kind: Pod
metadata:
  name: restored-reader
  namespace: csi-basics
spec:
  # nodeSelector, not nodeName: nodeName bypasses the scheduler, and a
  # WaitForFirstConsumer PVC only gets provisioned after the *scheduler*
  # records the chosen node in volume.kubernetes.io/selected-node.
  nodeSelector:
    kubernetes.io/hostname: csilab-worker
  restartPolicy: Never
  containers:
    - name: reader
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "--- /data/proof.txt inside the restored volume ---"
          cat /data/proof.txt
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: restored-pvc
