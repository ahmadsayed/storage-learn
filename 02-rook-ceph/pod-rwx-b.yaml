# ...and the reader half, pinned to csilab-worker2. If it can read what the other
# pod on the other node wrote, the filesystem really is shared.
apiVersion: v1
kind: Pod
metadata:
  name: rwx-reader
  namespace: ceph-demo
  labels:
    app: rwx-demo
    role: reader
spec:
  nodeSelector:
    kubernetes.io/hostname: csilab-worker2
  restartPolicy: Never
  containers:
    - name: reader
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          for i in $(seq 1 30); do
            [ -f /shared/from-writer.txt ] && break
            sleep 2
          done
          echo "reader on $(hostname) sees:"
          cat /shared/from-writer.txt
          sleep 3600
      volumeMounts:
        - name: shared
          mountPath: /shared
  volumes:
    - name: shared
      persistentVolumeClaim:
        claimName: cephfs-rwx
