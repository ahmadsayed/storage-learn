apiVersion: v1
kind: Pod
metadata:
  name: localpath-writer
  namespace: csi-basics
spec:
  # nodeSelector, not nodeName: nodeName bypasses the scheduler, and a
  # WaitForFirstConsumer PVC only gets provisioned after the *scheduler*
  # records the chosen node in volume.kubernetes.io/selected-node.
  nodeSelector:
    kubernetes.io/hostname: csilab-worker
  restartPolicy: Never
  containers:
    - name: writer
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "written by the local-path provisioner" > /data/proof.txt
          sync
          cat /data/proof.txt
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: localpath-pvc
